[project]
name = "lunchmoney-mcp-mini"
version = "0.3.0"
description = "A Model Context Protocol server for the Lunch Money API with optimized, minimal responses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.5",
    "pydantic>=2.12.5",
    "requests-openapi>=1.0.6",
]

[project.urls]
Repository = "https://github.com/sharph/lunchmoney-mcp-mini.git"
Issues = "https://github.com/sharph/lunchmoney-mcp-mini/issues"

[project.scripts]
lunchmoney-mcp-mini = "lunchmoney_mcp_mini.main:main"

[tool.setuptools]
packages = ["lunchmoney_mcp_mini"]

[tool.setuptools.package-data]
lunchmoney_mcp_mini = ["openapi.yaml"]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
